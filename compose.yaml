services:
  sticker-mcp:
    build: .
    container_name: yuyu-sticker-cabinet
    restart: unless-stopped
    environment:
      STICKER_HOST: 0.0.0.0
      STICKER_PORT: 8765
      STICKER_PUBLIC_BASE_URL: https://stickers.little-archive.com
    ports:
      - "127.0.0.1:${STICKER_HOST_PORT:-18765}:8765"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s = socket.create_connection(('127.0.0.1', 8765), 2); s.close()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

