<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-rounded, "SF Pro Rounded", "PingFang SC", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 96px;
        display: grid;
        place-items: center;
        background: transparent;
      }

      .card {
        width: min(80vw, 320px);
        padding: 4px;
        display: grid;
        place-items: center;
      }

      img {
        display: none;
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: 320px;
        object-fit: contain;
      }

      .status {
        padding: 20px 12px;
        color: color-mix(in srgb, CanvasText 62%, transparent);
        font-size: 14px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="card" aria-live="polite">
      <img id="sticker" alt="" />
      <div id="status" class="status">表情包正在跑来…</div>
    </main>

    <script>
      const image = document.getElementById("sticker");
      const status = document.getElementById("status");
      const pendingRequests = new Map();
      let nextRequestId = 1;
      let bridgeReady = false;

      function post(message) {
        window.parent.postMessage(message, "*");
      }

      function request(method, params) {
        const id = nextRequestId++;
        post({ jsonrpc: "2.0", id, method, params });
        return new Promise((resolve, reject) => {
          pendingRequests.set(id, { resolve, reject });
        });
      }

      function notify(method, params = {}) {
        post({ jsonrpc: "2.0", method, params });
      }

      function structured(value) {
        return value?.structuredContent ?? value?.structured_content ?? value;
      }

      function render(value) {
        const result = structured(value);
        if (!result?.image_url) return false;

        image.alt = result.alt || result.title || "yuyu 的表情包";
        image.onload = () => {
          image.style.display = "block";
          status.style.display = "none";
        };
        image.onerror = () => {
          image.style.display = "none";
          status.style.display = "block";
          status.textContent = "表情包迷路了，请刷新小炉子后再试一次。";
        };
        image.src = result.image_url;
        return true;
      }

      function reportSize() {
        if (!bridgeReady) return;
        notify("ui/notifications/size-changed", {
          width: Math.ceil(document.documentElement.scrollWidth),
          height: Math.ceil(document.documentElement.scrollHeight),
        });
      }

      window.addEventListener(
        "message",
        (event) => {
          if (event.source !== window.parent) return;
          const message = event.data;
          if (!message || message.jsonrpc !== "2.0") return;

          if (message.id !== undefined && pendingRequests.has(message.id)) {
            const pending = pendingRequests.get(message.id);
            pendingRequests.delete(message.id);
            if (message.error) pending.reject(message.error);
            else pending.resolve(message.result);
            return;
          }

          if (message.method === "ui/notifications/tool-result") {
            render(message.params);
          }
        },
        { passive: true }
      );

      async function connectBridge() {
        try {
          await request("ui/initialize", {
            appInfo: { name: "yuyu-sticker-card", version: "0.4.0" },
            appCapabilities: {},
            protocolVersion: "2026-01-26",
          });
          notify("ui/notifications/initialized");
          bridgeReady = true;

          const observer = new ResizeObserver(reportSize);
          observer.observe(document.documentElement);
          observer.observe(document.body);
          reportSize();
        } catch (_error) {
          status.textContent = "小炉子连接慢了一点，请刷新后再试一次。";
        }
      }

      connectBridge();

      if (!render(window.openai?.toolOutput)) {
        let attempts = 0;
        const fallback = window.setInterval(() => {
          attempts += 1;
          if (render(window.openai?.toolOutput) || attempts >= 40) {
            window.clearInterval(fallback);
          }
        }, 100);
      }
    </script>
  </body>
</html>
